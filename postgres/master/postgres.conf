### Master settings for PostgreSQL replication

# Listen on all interfaces so the slave can connect inside Docker network
listen_addresses = '*'

# Enable WAL streaming to replicas
wal_level = replica

# Capacity for one (or more) standby replicas
max_wal_senders = 10
max_replication_slots = 10

# Allow standby to run read-only queries
hot_standby = on

# Helps replicas catch up after short interruptions (optional)
wal_keep_size = 128MB

